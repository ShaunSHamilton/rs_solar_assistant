[package]
name = "rs_solar_assistant"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Rust client for SolarAssistant - cloud API, device REST, and real-time WebSocket"
readme = "README.md"
repository = "https://github.com/Solar-Assistant/rs_solar_assistant"
keywords = ["solar-assistant", "solar", "inverter", "battery", "homeassistant"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"

futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
  "sink",
], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
  "http2",
  "json",
  "query",
  "system-proxy",
], optional = true }
rustls = { version = "0.23.43", default-features = false, optional = true }
tokio = { version = "1.53.1", default-features = false, features = [
  "macros",
  "time",
], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "handshake",
], optional = true }

[dev-dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
  "sink",
] }
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "test-util",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "handshake",
] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wiremock = "0.6.5"

[features]
default = ["cloud", "device", "websocket", "rustls-tls"]

# Cloud REST client (`cloud::Client`).
cloud = ["rest"]
# Device REST client (`device::Client`).
device = ["rest"]
# Phoenix Channels WebSocket client (`socket::Socket`).
websocket = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite"]
# Shared HTTP plumbing behind `cloud` and `device`; not useful on its own.
rest = ["dep:reqwest"]

# TLS backends. Pick exactly one; enabling both wastes build time and only the
# rustls stack is used by `reqwest`.
rustls-tls = [
  "dep:rustls",
  "reqwest?/rustls",
  "rustls/aws-lc-rs",
  "tokio-tungstenite?/rustls-tls-native-roots",
]
native-tls = ["reqwest?/native-tls", "tokio-tungstenite?/native-tls"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "cloud_sites"
required-features = ["cloud", "device"]

[[example]]
name = "rest_read"
required-features = ["device"]

[[example]]
name = "rest_set"
required-features = ["device"]

[[example]]
name = "rest_system"
required-features = ["device"]

[[example]]
name = "websocket_read"
required-features = ["websocket"]

[[example]]
name = "websocket_set"
required-features = ["websocket"]
